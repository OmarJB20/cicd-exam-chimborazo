version: "3.9"

services:
  chimborazo:
    image: ghcr.io/chimborazo/chimborazo:1.0.5
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.chimborazo.entrypoints=http"
        - "traefik.http.routers.chimborazo.rule=Host(`chimborazo.byronrm.com`)"
        - "traefik.http.middlewares.chimborazo-https-redirect.redirectscheme.scheme=https"
        - "traefik.http.routers.chimborazo.middlewares=chimborazo-https-redirect"
        - "traefik.http.routers.chimborazo-secure.entrypoints=https"
        - "traefik.http.routers.chimborazo-secure.rule=Host(`chimborazo.byronrm.com`)"
        - "traefik.http.routers.chimborazo-secure.tls=true"
        - "traefik.http.routers.chimborazo-secure.tls.certresolver=http"
        - "traefik.http.routers.chimborazo-secure.service=chimborazo"
        - "traefik.http.services.chimborazo.loadbalancer.server.port=5000"
        - "traefik.docker.network=traefik-public"

    networks:
      - traefik-public

networks:
  traefik-public:
    external: true
