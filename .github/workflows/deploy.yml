name: CI/CD - Chimborazo

on:
  push:
    branches: [ chimborazo ]  # Tu rama es tu segundo apellido

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover tests

      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: omarjb20   # usuario GHCR correcto en minúscula
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ghcr.io/omarjb20/chimborazo:1.0.5  # imagen correcta

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Probar conexión SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            echo "✅ Conexión exitosa al VPS"
            hostname
            whoami

      - name: Copiar stack.yml al VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          source: "stack.yml"
          target: "/home/${{ secrets.VPS_USER }}/despliegue"

      - name: Desplegar servicios en el VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            echo "✅ Desplegando stack chimborazo"
            cd ~/despliegue

            # Login a GHCR y descargar imagen
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u omarjb20 --password-stdin
            docker pull ghcr.io/omarjb20/chimborazo:1.0.5

            # Remover stack anterior (si existe)
            docker stack rm chimborazo || true
            sleep 20

            # Desplegar stack con Traefik
            docker stack deploy -c stack.yml --with-registry-auth chimborazo
            docker ps
